<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/register/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script type="module" src="../js/register.js" defer></script>
</head>

<body>

    <main>

        <section class="card register-card">

            <h1>Sistema de Autenticação</h1>

            <p>

                Crie sua conta para acessar o sistema.

            </p>

            <form>

                <div class=" input-group">

                    <label for="name">

                        Nome

                    </label>

                    <div class="input-box">

                        <i class="bi bi-person-fill"></i>

                        <input type="text" id="name" placeholder="Digite seu nome completo" required>

                    </div>

                    <small class="error-message"></small>

                </div>

                <div class="input-group">

                    <label for="email">

                        E-mail

                    </label>

                    <div class="input-box">

                        <i class="bi bi-envelope-fill"></i>

                        <input type="email" id="email" placeholder="Digite seu e-mail" required>

                    </div>

                    <small class="error-message"></small>

                </div>

                <div class="input-group">

                    <label for="password">

                        Senha

                    </label>

                    <div class="input-box">

                        <i class="bi bi-lock-fill"></i>

                        <input type="password" id="password" placeholder="Digite sua senha" required>

                        <button type="button" class="show-password">

                            <i class="bi bi-eye-fill"></i>

                        </button>

                    </div>

                    <small class="error-message"></small>

                </div>

                <div class="input-group">

                    <label for="confirmPassword">

                        Confirmar senha

                    </label>

                    <div class="input-box">

                        <i class="bi bi-lock-fill"></i>

                        <input type="password" id="confirmPassword" placeholder="Confirme sua senha" required>

                        <button type="button" class="show-password">

                            <i class="bi bi-eye-fill"></i>

                        </button>

                    </div>

                    <small class="error-message"></small>

                </div>

                <button type="submit" class="btn">

                    Cadastrar

                </button>

            </form>

            <p>

                Já possui uma conta?

                <a href="../../index.html">

                    Entrar

                </a>

            </p>

        </section>

    </main>

</body>

</html>
